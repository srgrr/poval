[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poval"
version = "0.1.0"
description = "Minimal validation language and callable library API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.2",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
notebook = [
    "marimo>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/poval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
